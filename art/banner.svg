<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>

  <text x="80" y="110" font-size="62" font-weight="700" fill="#f8fafc">Slug History</text>
  <rect x="80" y="132" width="120" height="6" rx="3" fill="url(#accent)"/>
  <text x="80" y="182" font-size="26" fill="#94a3b8">Laravel  |  Symfony  |  Doctrine</text>
  <text x="1200" y="110" font-size="24" fill="#94a3b8" text-anchor="end">Rename anything.</text>
  <text x="1200" y="146" font-size="24" fill="#94a3b8" text-anchor="end">The old link still works.</text>

  <!-- Ancienne adresse -->
  <g>
    <rect x="80" y="232" width="470" height="70" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <circle cx="116" cy="267" r="13" fill="none" stroke="#64748b" stroke-width="3"/>
    <line x1="110" y1="267" x2="122" y2="267" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <text x="148" y="277" font-size="25" fill="#64748b" font-family="Consolas, 'Courier New', monospace">/blog/mon-artcile</text>
    <text x="84" y="336" font-size="19" fill="#64748b">adresse partagee il y a deux ans</text>
  </g>

  <!-- Redirection -->
  <path d="M572 267 C 620 267, 636 267, 678 267" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#head)"/>
  <rect x="588" y="206" width="72" height="34" rx="17" fill="#38bdf8"/>
  <text x="624" y="230" font-size="18" font-weight="700" fill="#0b1220" text-anchor="middle">301</text>

  <!-- Nouvelle adresse -->
  <g>
    <rect x="706" y="232" width="494" height="70" rx="14" fill="#0b1220" stroke="#22c55e" stroke-width="2"/>
    <circle cx="742" cy="267" r="13" fill="none" stroke="#22c55e" stroke-width="3"/>
    <path d="M736 267 L741 273 L750 261" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="774" y="277" font-size="25" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace">/blog/mon-article</text>
    <text x="710" y="336" font-size="19" fill="#94a3b8">le titre a ete corrige ce matin</text>
  </g>

  <text x="80" y="404" font-size="22" fill="#64748b" font-family="Consolas, 'Courier New', monospace">composer require kaveraa/slug-history</text>
</svg>
