name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Permet de relancer la suite à la main sur une branche, depuis l'onglet Actions.
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php }} - ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          # Versions minimales supportées : Laravel 12, Symfony 7.2, Doctrine ORM 3.3
          - { php: '8.2', dependencies: lowest }

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - run: vendor/bin/phpunit

  # Contrôle unique exigé par la protection de la branche main :
  # il ne passe que si tous les jobs de la matrice ont réussi.
  tests-passed:
    name: All tests passed
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = "success"
