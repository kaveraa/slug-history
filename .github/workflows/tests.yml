name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets you run the test suite by hand on a branch, from the Actions tab.
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php }} - ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          # Lowest supported versions: Laravel 12, Symfony 7.2, Doctrine ORM 3.3
          - { php: '8.2', dependencies: lowest }

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - run: vendor/bin/phpunit

  # The single check required by the protection of the main branch:
  # it passes only when all the jobs of the matrix have passed.
  tests-passed:
    name: All tests passed
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = "success"
